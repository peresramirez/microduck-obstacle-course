<rect class="f-ext" x="73.0" y="214.0" width="36" height="86.0" stroke="none"/>
<text class="ink sm" x="91.0" y="209.0" text-anchor="middle">39</text>
<rect class="f-ours" x="113.0" y="90.3" width="36" height="209.7" stroke="none"/>
<text class="ink sm" x="131.0" y="85.3" text-anchor="middle">95</text>
<rect class="f-brain" x="153.0" y="85.1" width="36" height="214.9" stroke="none"/>
<text class="ink sm" x="171.0" y="80.1" text-anchor="middle">98</text>
<text class="ink b sm" x="131.0" y="320" text-anchor="middle">Real course</text><text class="mu sm" x="131.0" y="336" text-anchor="middle">0.25 m/s</text>
<rect class="f-ext" x="215.0" y="181.4" width="36" height="118.6" stroke="none"/>
<text class="ink sm" x="233.0" y="176.4" text-anchor="middle">54</text>
<rect class="f-ours" x="255.0" y="105.7" width="36" height="194.3" stroke="none"/>
<text class="ink sm" x="273.0" y="100.7" text-anchor="middle">88</text>
<rect class="f-brain" x="295.0" y="92.1" width="36" height="207.9" stroke="none"/>
<text class="ink sm" x="313.0" y="87.1" text-anchor="middle">94</text>
<text class="ink b sm" x="273.0" y="320" text-anchor="middle">Faster</text><text class="mu sm" x="273.0" y="336" text-anchor="middle">0.35 m/s</text>
<rect class="f-ext" x="357.0" y="296.5" width="36" height="3.5" stroke="none"/>
<text class="ink sm" x="375.0" y="291.5" text-anchor="middle">2</text>
<rect class="f-ours" x="397.0" y="181.4" width="36" height="118.6" stroke="none"/>
<text class="ink sm" x="415.0" y="176.4" text-anchor="middle">54</text>
<rect class="f-brain" x="437.0" y="119.6" width="36" height="180.4" stroke="none"/>
<text class="ink sm" x="455.0" y="114.6" text-anchor="middle">82</text>
<text class="ink b sm" x="415.0" y="320" text-anchor="middle">Harder</text><text class="mu sm" x="415.0" y="336" text-anchor="middle">heights × 1.4, wet 0.2</text>
<rect class="f-ext" x="499.0" y="88.6" width="36" height="211.4" stroke="none"/>
<text class="ink sm" x="517.0" y="83.6" text-anchor="middle">96</text>
<rect class="f-ours" x="539.0" y="83.5" width="36" height="216.5" stroke="none"/>
<text class="ink sm" x="557.0" y="78.5" text-anchor="middle">98</text>
<rect class="f-brain" x="579.0" y="80.0" width="36" height="220.0" stroke="none"/>
<text class="ink sm" x="597.0" y="75.0" text-anchor="middle">100</text>
<text class="ink b sm" x="557.0" y="320" text-anchor="middle">Flat lanes</text><text class="mu sm" x="557.0" y="336" text-anchor="middle">forgetting check</text>
<rect class="f-ext" x="641.0" y="298.2" width="36" height="1.8" stroke="none"/>
<text class="ink sm" x="659.0" y="293.2" text-anchor="middle">1</text>
<rect class="f-ours" x="681.0" y="294.9" width="36" height="5.1" stroke="none"/>
<text class="ink sm" x="699.0" y="289.9" text-anchor="middle">2</text>
<rect class="f-brain" x="721.0" y="88.6" width="36" height="211.4" stroke="none"/>
<text class="ink sm" x="739.0" y="83.6" text-anchor="middle">96</text>
<text class="ink b sm" x="699.0" y="320" text-anchor="middle">Straight at box</text><text class="mu sm" x="699.0" y="336" text-anchor="middle">no steering round it</text>
<rect class="f-ext" x="783.0" y="300.0" width="36" height="0.0" stroke="none"/>
<text class="ink sm" x="801.0" y="295.0" text-anchor="middle">0</text>
<rect class="f-ours" x="823.0" y="287.9" width="36" height="12.1" stroke="none"/>
<text class="ink sm" x="841.0" y="282.9" text-anchor="middle">6</text>
<rect class="f-brain" x="863.0" y="95.4" width="36" height="204.6" stroke="none"/>
<text class="ink sm" x="881.0" y="90.4" text-anchor="middle">93</text>
<text class="ink b sm" x="841.0" y="320" text-anchor="middle">Box moved</text><text class="mu sm" x="841.0" y="336" text-anchor="middle">never seen there</text>
</svg>
