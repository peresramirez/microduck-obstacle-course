<line class="grid" x1="60" y1="190.0" x2="912" y2="190.0"/><text class="mu sm" x="52" y="194.0" text-anchor="end">50</text>
<line class="grid" x1="60" y1="135.0" x2="912" y2="135.0"/><text class="mu sm" x="52" y="139.0" text-anchor="end">75</text>
